<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Shield -->
  <rect width="512" height="512" rx="96" fill="#0f172a"/>
  
  <!-- Outer Safety Border -->
  <rect x="24" y="24" width="464" height="464" rx="72" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="24 12"/>
  
  <!-- Foundation & Ground Outriggers -->
  <rect x="180" y="440" width="152" height="24" rx="4" fill="#334155"/>
  <rect x="200" y="420" width="112" height="20" rx="4" fill="#475569"/>
  
  <!-- Tower Mast Vertical Lattice -->
  <rect x="236" y="160" width="40" height="260" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>
  <!-- Mast Bracing Lines -->
  <line x1="236" y1="160" x2="276" y2="200" stroke="#f59e0b" stroke-width="3"/>
  <line x1="276" y1="160" x2="236" y2="200" stroke="#f59e0b" stroke-width="3"/>
  <line x1="236" y1="200" x2="276" y2="240" stroke="#f59e0b" stroke-width="3"/>
  <line x1="276" y1="200" x2="236" y2="240" stroke="#f59e0b" stroke-width="3"/>
  <line x1="236" y1="240" x2="276" y2="280" stroke="#f59e0b" stroke-width="3"/>
  <line x1="276" y1="240" x2="236" y2="280" stroke="#f59e0b" stroke-width="3"/>
  <line x1="236" y1="280" x2="276" y2="320" stroke="#f59e0b" stroke-width="3"/>
  <line x1="276" y1="280" x2="236" y2="320" stroke="#f59e0b" stroke-width="3"/>
  <line x1="236" y1="320" x2="276" y2="360" stroke="#f59e0b" stroke-width="3"/>
  <line x1="276" y1="320" x2="236" y2="360" stroke="#f59e0b" stroke-width="3"/>
  <line x1="236" y1="360" x2="276" y2="400" stroke="#f59e0b" stroke-width="3"/>
  <line x1="276" y1="360" x2="236" y2="400" stroke="#f59e0b" stroke-width="3"/>
  <line x1="236" y1="400" x2="276" y2="420" stroke="#f59e0b" stroke-width="3"/>

  <!-- Slewing Ring & Operator Cab -->
  <rect x="226" y="146" width="60" height="14" rx="2" fill="#10b981"/>
  <rect x="272" y="118" width="34" height="28" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <line x1="280" y1="126" x2="300" y2="126" stroke="#e0f2fe" stroke-width="2"/>

  <!-- Tower Peak / Apex -->
  <polygon points="256,60 236,146 276,146" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>

  <!-- Counter-Jib (Left) & Ballast Weights -->
  <line x1="256" y1="146" x2="110" y2="146" stroke="#f59e0b" stroke-width="6"/>
  <line x1="256" y1="60" x2="110" y2="146" stroke="#94a3b8" stroke-width="3"/>
  <rect x="110" y="132" width="36" height="28" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="2"/>

  <!-- Main Working Jib (Right) -->
  <line x1="256" y1="146" x2="430" y2="146" stroke="#f59e0b" stroke-width="6"/>
  <line x1="256" y1="60" x2="430" y2="146" stroke="#94a3b8" stroke-width="3"/>
  <line x1="256" y1="60" x2="340" y2="146" stroke="#94a3b8" stroke-width="2"/>

  <!-- Trolley and Hoist Cable -->
  <rect x="330" y="144" width="22" height="12" rx="2" fill="#10b981"/>
  <line x1="341" y1="156" x2="341" y2="280" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 2"/>
  
  <!-- Pulley Block & Heavy Hook -->
  <circle cx="341" cy="286" r="8" fill="#f59e0b"/>
  <path d="M341,294 C341,310 326,315 326,322 C326,330 338,332 344,324" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>

  <!-- Safety ASVAM Pulse Wave (Bottom Overlay) -->
  <path d="M60,450 L140,450 L160,425 L175,475 L195,435 L210,450 L450,450" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
</svg>
